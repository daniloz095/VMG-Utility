name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: python3 kit/tools/build.py m_vitals_plus

      - name: Upload .mgu artifact
        uses: actions/upload-artifact@v4
        with:
          name: m_vitals_plus-mgu
          path: dist/*.mgu
          if-no-files-found: error

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.mgu --generate-notes --title "${{ github.ref_name }}"
